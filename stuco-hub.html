  if(f.type==="checkbox")return`<div class="field check${full}"><input type="checkbox" id="${id}" ${v?"checked":""}><label for="${id}">${f.label}</label></div>`;
  if(f.type==="photos")return`<div class="field full"><label for="${id}">${f.label}</label><div class="thumbs" id="${id}-list"></div><div class="photo-row"><input type="file" id="${id}" accept="image/*" ${f.multiple?"multiple":""}><span class="sub" id="${id}-status" role="status"></span></div>${f.help?`<span class="sub">${f.help}</span>`:""}</div>`;
  if(f.type==="photo")return`<div class="field full"><label for="${id}">${f.label}</label><div class="photo-row"><img id="${id}-prev" class="avatar xl" src="${esc(v||"")}" alt="" ${v?"":"hidden"}><input type="file" id="${id}" accept="image/*"><button type="button" class="btn sm ghost" id="${id}-clear" ${v?"":"hidden"}>Remove photo</button></div><span class="sub">Square photos look best. It's resized automatically.</span></div>`;
  if(f.type==="people")return`<div class="field full"><span class="flabel" id="${id}-l">${f.label}</span><div class="people" id="${id}" role="group" aria-labelledby="${id}-l">${f.options.map(([k,l])=>`<label class="pchk"><input type="checkbox" value="${esc(k)}" ${(v||[]).includes(k)?"checked":""}><span>${esc(l)}</span></label>`).join("")||`<span class="sub">No council members yet.</span>`}</div>${f.help?`<span class="sub">${f.help}</span>`:""}</div>`;
  let input;
  if(f.type==="textarea")input=`<textarea id="${id}"${req} placeholder="${esc(f.placeholder||"")}">${esc(v)}</textarea>`;
  else if(f.type==="select")input=`<select id="${id}">${f.options.map(([k,l])=>`<option value="${esc(k)}" ${String(v??"")===String(k)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  else input=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}"${f.placeholder?` placeholder="${esc(f.placeholder)}"`:""}${req}${f.list?` list="${id}-l"`:""}${f.type==="number"?' min="0" step="any"':""}>${f.list?`<datalist id="${id}-l">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`;
  return`<div class="field${full}"><label for="${id}">${f.label}</label>${input}</div>`;
}
function resizeImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=256,c=document.createElement("canvas");c.width=c.height=s;const k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;c.getContext("2d").drawImage(img,(s-w)/2,(s-h)/2,w,h);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function openForm({title,fields,values={},submit,onDelete,submitLabel="Save",note=""}){

  m.hidden=false;
  const first=m.querySelector("input:not([type=file]),textarea,select");first&&first.focus();
  fields.filter(f=>f.type==="photo").forEach(f=>{
    const inp=$("#f-"+f.id),prev=$("#f-"+f.id+"-prev"),clr=$("#f-"+f.id+"-clear");photoVals[f.id]=values[f.id]||"";
    inp.onchange=async()=>{const file=inp.files[0];if(!file)return;try{const url=await resizeImage(file);photoVals[f.id]=url;prev.src=url;prev.hidden=false;clr.hidden=false}catch{toast("That image couldn't be read. Try a JPG or PNG.")}};
    clr.onclick=()=>{photoVals[f.id]="";prev.hidden=true;clr.hidden=true;inp.value=""};
  });
  const lists={};let uploading=0;
  fields.filter(f=>f.type==="photos").forEach(f=>{
    const v=values[f.id];lists[f.id]=Array.isArray(v)?[...v]:v?[v]:[];
    const listEl=$("#f-"+f.id+"-list"),inp=$("#f-"+f.id),st=$("#f-"+f.id+"-status");
    const draw=()=>{listEl.innerHTML=lists[f.id].map((pid,i)=>`<div class="thumb"><button type="button" class="thumb-img" data-i="${i}" aria-label="${f.multiple&&i?"Make this the cover":"Photo "+(i+1)}"><img src="${blob(pid)}" alt="">${f.multiple&&i===0?'<span class="cover-tag">Cover</span>':""}</button><button type="button" class="thumb-x" data-x="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join("")};
    listEl.onclick=ev=>{const x=ev.target.closest("[data-x]"),c=ev.target.closest("[data-i]");if(x){lists[f.id].splice(+x.dataset.x,1);draw()}else if(c&&f.multiple){const[pick]=lists[f.id].splice(+c.dataset.i,1);lists[f.id].unshift(pick);draw()}};
    inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;
      const A=window.claude&&window.claude.use?await claude.use("assets"):null;
      if(!A){toast("Uploading photos needs Editor access to this page.");inp.value="";return}
      uploading++;let n=0;
      for(const file of files){n++;st.textContent=`Uploading ${n} of ${files.length}…`;try{const b=await resizeToBlob(file,1800);const r=await A.upload(b);if(f.multiple)lists[f.id].push(r.id);else lists[f.id]=[r.id];draw()}catch(e){toast(`${file.name} couldn't be uploaded. Try a JPG or PNG.`)}}
      uploading--;st.textContent="";inp.value=""};
    draw();
  });
  $("#mcancel").onclick=closeModal;
  if(onDelete){const d=$("#mdel");d.onclick=async()=>{if(d.dataset.armed){d.disabled=true;if(await onDelete()!==false)closeModal();else d.disabled=false}else{d.dataset.armed=1;d.textContent="Confirm delete"}}}
  $("#mform").onsubmit=async e=>{
    e.preventDefault();const vals={};
    if(uploading){$("#merr").textContent="Wait for the photos to finish uploading.";return}
    for(const f of fields){const el=$("#f-"+f.id);vals[f.id]=f.type==="photos"?(f.multiple?lists[f.id]:(lists[f.id][0]||"")):f.type==="photo"?photoVals[f.id]:f.type==="checkbox"?el.checked:f.type==="people"?[...el.querySelectorAll("input:checked")].map(i=>i.value):f.type==="number"?(el.value===""?null:Number(el.value)):el.value.trim()}
    const miss=fields.find(f=>f.required&&(Array.isArray(vals[f.id])?!vals[f.id].length:!vals[f.id]));if(miss){$("#merr").textContent=`Add ${miss.label.toLowerCase()} to continue.`;return}
    $("#msave").disabled=true;
    if(await submit(vals)!==false)closeModal();else $("#msave").disabled=false;
  };
}

      return save(()=>Promise.all([doc,...(all?later:[])].map(x=>col("plans").doc(x.id).delete())),all?`Deleted ${n} dates`:"Deleted",["deleted","calendar item",doc.title])}:null});
}

const AREAS={post:["evRow","calendar","bulletin","weekView","postCard","eventsView","eventCard","albumCard","storyCard","aviatorBlock","bdayPanel","playlistPanel","oppList","oppCard","lifeView"],
  approve:["modPanel","feedCard","submitItem","postForm","workBar","clubsView","clubPage","clubPageForm","canEditClub","postHTML","clubPostForm"],

for(const[cap,names]of Object.entries(AREAS))for(const n of names){const f=window[n];if(typeof f!=="function"){console.warn("AREAS: no function",n);continue}
  window[n]=function(...a){const prev=AREA;AREA=cap;try{return f.apply(this,a)}finally{AREA=prev}}}

/* ---------- boot ---------- */
render();
(async()=>{
  /* on the website the Firebase scripts are deferred so the page paints first; they have run by DOMContentLoaded */
  if(document.readyState==="loading")await new Promise(r=>addEventListener("DOMContentLoaded",r,{once:true}));
  if(!window.claude||!window.claude.use){setStatus("offline");render();return}
  const[d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  db=d;U=u;LEAN=!!(db&&typeof db.query==="function");
  if(u){const m=await u.me();me={id:m.id,name:m.name,email:m.email,avatarUrl:m.avatarUrl,color:m.color};isPres=!!m.isOwner;isEditor=!!m.canEdit||isPres;const c=await u.can("data.write");if(c===false)canWrite=false}
  if(!db){setStatus("nodb");render();return}
  slowTimer=setTimeout(()=>{if(!subsReady())setStatus("slow")},10000);
  db.doc("config/access").onSnapshot(s=>{cfgExists=s.exists;CFG={approved:{},roles:{},school:"",president:null,...(s.exists?s.data():{})};subDone("config",s);render()},subFail);
  if(isPres)db.doc("admin/access").onSnapshot(s=>{adminExists=s.exists;ADMIN={emails:[],...(s.exists?s.data():{})};loaded.add("admin");render();syncGrants();autoApprove()},subFail);
  if(!LEAN)COLS.filter(c=>isEditor||!COUNCIL_ONLY.includes(c)).forEach(c=>want(c,"all"));
  bootDone=true;setStatus("connecting");render();
})();
