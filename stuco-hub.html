<title>Avenues Student Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400..900;1,400&display=swap">
<style>
/* Hall pass. One bold move: a pennant-gold rail with heavy Franklin Gothic navigation. The work area stays quiet: white ground, navy ink, sections marked by a thick ink rule, cards only for real objects. Everything left-aligned. */
:root{
  --ground:#F1F3F5; --surface:#FFFFFF; --ink:#14202E; --muted:#56606C; --rule:#CCD2D9; --rule-strong:#14202E;
  --rail:#F4B400; --rail-ink:#14202E; --rail-dim:rgba(20,32,46,.72); --rail-hover:rgba(20,32,46,.1);
  --info:#2650B8; --info-soft:#E3E9F8; --good:#1D7A45; --good-soft:#DFF0E5; --bad:#B3261E; --bad-soft:#F8E1DF; --warn:#8A5A00; --warn-soft:#FBEFC9;
  --paper:#FFFFFF; --paper-ink:#14202E; --paper-muted:#5E6873; --paper-line:#D5DAE0; --paper-gold:#F4B400;
  --scrim:rgba(20,32,46,.55); --stage:#0E141B;
  --f:"Libre Franklin","Franklin Gothic","Franklin Gothic Book","ITC Franklin Gothic","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0F151C; --surface:#18212B; --ink:#E8ECF0; --muted:#9BA6B2; --rule:#2B3642; --rule-strong:#E8ECF0;
  --rail:#E9AC00; --info:#8EA9FF; --info-soft:#1E2B4D; --good:#5CC98A; --good-soft:#15301F; --bad:#FF8A80; --bad-soft:#3A1B19; --warn:#F0C24A; --warn-soft:#3A2E10;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F151C; --surface:#18212B; --ink:#E8ECF0; --muted:#9BA6B2; --rule:#2B3642; --rule-strong:#E8ECF0;
  --rail:#E9AC00; --info:#8EA9FF; --info-soft:#1E2B4D; --good:#5CC98A; --good-soft:#15301F; --bad:#FF8A80; --bad-soft:#3A1B19; --warn:#F0C24A; --warn-soft:#3A2E10;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f);text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* the rail: the one loud element */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:28px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.top-row{display:flex;flex-direction:column;gap:18px}
.brand b{display:block;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:.95}
.brand small{display:block;font-size:14px;color:var(--rail-dim);margin-top:4px}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;padding-top:14px;border-top:2px solid var(--rail-ink)}
.me .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .title{font-weight:700}
.me .sub{color:var(--rail-dim)}
nav{display:flex;flex-direction:column;gap:2px;margin-inline:-8px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:3px;color:var(--rail-ink);text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
nav a:hover{background:var(--rail-hover)}
nav a[aria-current="page"]{background:var(--rail-ink);color:var(--rail)}
nav a .count{font-size:13px;font-weight:700;min-width:22px;text-align:center;padding:0 6px;border-radius:3px;background:var(--rail-ink);color:var(--rail)}
nav a[aria-current="page"] .count{background:var(--rail);color:var(--rail-ink)}
.status{margin-top:auto;font-size:13px;color:var(--rail-dim);display:flex;gap:8px;align-items:flex-start}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rail-dim);margin-top:6px;flex:none}
.status.ok .dot{background:#1D7A45} .status.err .dot{background:#B3261E}

/* work area */
main{padding:0;min-width:0}
.wrap{max-width:1144px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
.context{margin:8px 0 0;color:var(--muted);font-size:17px;max-width:62ch}
.btn{border:1.5px solid var(--rule-strong);background:transparent;border-radius:3px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink);opacity:.88}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--rule)}
.btn.danger{color:var(--bad)}
.btn.good{background:var(--good);color:var(--surface);border-color:var(--good)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.banner{border-left:4px solid var(--rail);background:var(--surface);padding:12px 16px;font-size:15px;max-width:80ch}
.banner a{color:var(--info);font-weight:600}
.panel{border-top:3px solid var(--rule-strong);padding-top:12px;min-width:0}
.panel h2{font-size:22px;font-weight:800;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 a{font-size:15px;font-weight:600;color:var(--info);text-decoration:none}
.panel h2 a:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 40px}
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.list li{padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:14px;align-items:flex-start;min-width:0}
.list li:first-child{border-top:0}
.datebox{width:46px;flex:none;text-align:center;line-height:1}
.datebox .m{font-size:13px;color:var(--muted);font-weight:600}
.datebox .d{font-weight:800;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.grow{flex:1;min-width:0}
.title{font-weight:700;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:1px 7px;border-radius:3px;background:var(--ground);color:var(--muted);white-space:nowrap;border:1px solid var(--rule)}
.chip.meeting,.chip.accent{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.event,.chip.gold{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.deadline,.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.fundraiser,.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;object-fit:cover}
.avatar.lg{width:38px;height:38px;font-size:14px}
.avatar.xl{width:76px;height:76px;font-size:24px}
.who{display:inline-flex;align-items:center;gap:7px;font-size:14px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:16px;color:var(--muted)}
.summary b{color:var(--ink);font-weight:800}
.empty{padding:24px 0 8px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:60ch}
.empty strong{color:var(--ink);font-size:18px;font-weight:700}
.start{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;background:var(--surface);border-left:6px solid var(--rail);padding:24px 26px}
.start h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.start ol{margin:12px 0 0;padding-left:22px;color:var(--muted)}
.start .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar h2{font-size:28px;font-weight:800;letter-spacing:-.02em;min-width:200px}
.calscroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:3px solid var(--rule-strong);min-width:320px}
.cal .dow{font-size:14px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--rule)}
.cal .day{background:transparent;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);text-align:left;align-items:stretch;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day:hover{background:var(--surface)}
.cal .day.out{color:var(--muted);opacity:.55}
.cal .num{font-size:15px;font-weight:700}
.cal .day.today .num{background:var(--rail);color:var(--rail-ink);border-radius:3px;padding:0 6px;align-self:flex-start}
.cal .ev{font-size:12px;font-weight:600;padding:1px 5px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;border:0}
.cal .day[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--rule-strong)}
.cal .ev.plan{color:var(--ink);padding-left:1px}
.cal .ev.plan.done{color:var(--muted);text-decoration:line-through}
.cal .ev.more{color:var(--muted);padding-left:1px}
.plans li{align-items:flex-start}
.plans input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--good);cursor:pointer}
.plans .title{font-size:17px;font-weight:700;cursor:pointer;display:block}
.plans li.done .title{text-decoration:line-through;color:var(--muted)}
.plan-late{color:var(--bad);font-weight:700}
.plan-notes{margin-top:4px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.plan-evs{margin:12px 0 0}
.flabel{font-size:15px;font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:8px}
.pchk{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1.5px solid var(--rule);border-radius:3px;cursor:pointer;font-size:15px;font-weight:600;min-height:40px}
.pchk:has(input:checked){border-color:var(--rule-strong);background:var(--warn-soft)}
.pchk input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.cal .ev.task{background:transparent;color:var(--muted);font-weight:500;padding-left:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* tasks */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input{border:1.5px solid var(--rule);background:var(--surface);border-radius:3px;padding:7px 10px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.col{border-top:3px solid var(--rule-strong);padding-top:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:19px;font-weight:800;display:flex;justify-content:space-between}
.col h3 .mono{color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.mine{border-left:5px solid var(--rail)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .detail{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pri{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pri.high{background:var(--bad)} .pri.normal{background:var(--warn)} .pri.low{background:var(--rule)}
.iconbtns{display:flex;gap:4px;flex-wrap:wrap}
.ib{border:1.5px solid var(--rule);background:transparent;border-radius:3px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-weight:700}
.ib:hover{color:var(--ink);border-color:var(--ink)}
.overdue{color:var(--bad);font-weight:700}

/* bulletin */
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.post{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.post.pinned{grid-column:1/-1;border:0;border-top:6px solid var(--rail);border-radius:0 0 6px 6px}
.post.pinned h3{font-size:30px}
.post h3{font-size:23px;font-weight:800;letter-spacing:-.015em}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch;font-size:16px}
.post .meta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.post{position:relative}
.post.lv-important,.post.lv-popup{border-left:5px solid var(--bad)}
.post.pinned.lv-important,.post.pinned.lv-popup{border-left:0;border-top-color:var(--bad)}
.p-head{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.p-head time{white-space:nowrap}
.p-new{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--info);font-size:13px}
.p-new::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--info)}
.p-body{max-width:68ch;overflow-wrap:anywhere;font-size:16px}
.p-body p{margin:0 0 10px}.p-body p:last-child,.p-body ul:last-child{margin-bottom:0}
.p-body ul{margin:0 0 10px;padding-left:20px}.p-body li{margin:2px 0}
.p-body a{color:var(--info);font-weight:600}
.p-body.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post .more{align-self:flex-start;background:none;border:0;padding:0;color:var(--info);font-weight:700;cursor:pointer;font-size:15px}
.p-foot{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;margin-top:auto}
.alert-bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad);padding:12px 14px 12px 16px;border-radius:0 6px 6px 0;margin:0 0 18px}
.alert-bar a{color:var(--ink);font-weight:800;text-decoration:none;flex:1 1 220px;min-width:0}
.alert-bar a:hover{text-decoration:underline}
.alert-bar .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:3px}
.alert-bar .x:hover{color:var(--ink);background:var(--rail-hover)}
.ann-bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.ann-bar input{flex:1 1 240px;min-width:0}.ann-bar select{flex:0 0 auto}
.ann-bar input,.ann-bar select{border:1.5px solid var(--rule);background:var(--surface);border-radius:3px;padding:8px 10px;color:var(--ink)}
.sheet.pop{border-top-color:var(--bad);width:min(520px,100%)}
.sheet.pop h2{margin:10px 0 12px}
.sheet.pop .p-body{margin-bottom:18px}
.lunch{border-top:6px solid var(--rail);border-radius:0 0 6px 6px}
/* club colors */
.cc-teal{--cc:#0F766E;--cc-soft:#DDF3F0}.cc-blue{--cc:#2446C7;--cc-soft:#E3E9F8}.cc-purple{--cc:#7B3FB8;--cc-soft:#EFE5FA}.cc-pink{--cc:#B8306E;--cc-soft:#FBE4EE}.cc-red{--cc:#B4442F;--cc-soft:#F8E3DE}.cc-orange{--cc:#B35A00;--cc-soft:#FCEBD9}.cc-green{--cc:#1C7A45;--cc-soft:#DFF0E5}.cc-olive{--cc:#5A6B2E;--cc-soft:#EBEFDD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cc-teal{--cc:#4FD1C0;--cc-soft:#12302C} :root:not([data-theme="light"]) .cc-blue{--cc:#8EA9FF;--cc-soft:#1E2B4D} :root:not([data-theme="light"]) .cc-purple{--cc:#C39BF0;--cc-soft:#2C1F3D} :root:not([data-theme="light"]) .cc-pink{--cc:#F28BB8;--cc-soft:#3A1A29} :root:not([data-theme="light"]) .cc-red{--cc:#FF9A85;--cc-soft:#3A1E19} :root:not([data-theme="light"]) .cc-orange{--cc:#F5A85A;--cc-soft:#3A2712} :root:not([data-theme="light"]) .cc-green{--cc:#5CC98A;--cc-soft:#15301F} :root:not([data-theme="light"]) .cc-olive{--cc:#B9C97A;--cc-soft:#262C17}}
:root[data-theme="dark"] .cc-teal{--cc:#4FD1C0;--cc-soft:#12302C} :root[data-theme="dark"] .cc-blue{--cc:#8EA9FF;--cc-soft:#1E2B4D} :root[data-theme="dark"] .cc-purple{--cc:#C39BF0;--cc-soft:#2C1F3D} :root[data-theme="dark"] .cc-pink{--cc:#F28BB8;--cc-soft:#3A1A29} :root[data-theme="dark"] .cc-red{--cc:#FF9A85;--cc-soft:#3A1E19} :root[data-theme="dark"] .cc-orange{--cc:#F5A85A;--cc-soft:#3A2712} :root[data-theme="dark"] .cc-green{--cc:#5CC98A;--cc-soft:#15301F} :root[data-theme="dark"] .cc-olive{--cc:#B9C97A;--cc-soft:#262C17}
.post.club{border-left:5px solid var(--cc)}
.chip.club{background:var(--cc-soft);color:var(--cc);border-color:transparent}
.p-club{color:var(--cc);font-weight:700;text-decoration:none;font-size:14px}.p-club:hover{text-decoration:underline}
.opp.club-card{border-top:6px solid var(--cc);border-radius:0 0 6px 6px}
.club-card h3 a{color:var(--ink);text-decoration:none}.club-card h3 a:hover{color:var(--cc);text-decoration:underline}
.club-card .tagline{color:var(--cc);font-weight:700;font-size:15px;margin:0}
.club-hero{background:var(--cc-soft);border-top:8px solid var(--cc);border-radius:0 0 8px 8px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center;margin-bottom:22px}
.club-hero .tagline{font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--ink);margin:0;text-wrap:balance}
.club-hero .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:15px;color:var(--muted)}.club-hero .facts b{color:var(--ink)}
.club-hero .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.club-cover{width:100%;max-height:340px;object-fit:cover;border-radius:6px;display:block;margin-bottom:22px}
.club-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.club-side dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 14px;margin:10px 0 0;font-size:15px}.club-side dt{color:var(--muted);font-weight:700}.club-side dd{margin:0;overflow-wrap:anywhere}
.club-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.club-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
@media (max-width:760px){.club-grid{grid-template-columns:minmax(0,1fr)}.club-hero{grid-template-columns:minmax(0,1fr)}.club-hero .acts{flex-direction:row;flex-wrap:wrap}}
.lunch-top{display:flex;align-items:baseline;gap:10px}.lunch-top .sub{margin-left:auto}
.ldays{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:12px 0 14px}
.ldays button{border:1.5px solid var(--rule);background:transparent;border-radius:3px;padding:5px 0;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.ldays button small{font-size:16px;color:var(--ink);font-weight:800}
.ldays button.is-today{border-color:var(--ink)}
.ldays button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.ldays button[aria-selected="true"] small{color:var(--ground)}
.dish-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dish{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.lunch dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 12px;margin:14px 0 0;font-size:14.5px}
.lunch dt{color:var(--muted);font-weight:700}.lunch dd{margin:0}
.lunch .fine{font-size:13px;color:var(--muted);margin:14px 0 0}

/* split views */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.pick{display:flex;flex-direction:column;border-top:3px solid var(--rule-strong)}
.pick button{text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pick button:hover{background:var(--surface)}
.pick button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 5px 0 0 var(--rail)}
.steps{display:flex;flex-wrap:wrap;gap:0}
.steps span{font-size:14px;padding:5px 12px;color:var(--muted);font-weight:600;border:1.5px solid var(--rule);margin-left:-1.5px}
.steps span:first-child{margin-left:0;border-radius:3px 0 0 3px}
.steps span:last-child{border-radius:0 3px 3px 0}
.steps span.on{background:var(--ink);color:var(--ground);border-color:var(--ink);position:relative}
.steps span.done{color:var(--ink)}
.tablewrap{overflow-x:auto}
.seg.view button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:700}
.arch-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}.arch-bar input{flex:1 1 260px;min-width:0}
.arch-bar input,.arch-bar select{border:1.5px solid var(--rule);background:var(--surface);border-radius:3px;padding:8px 10px;color:var(--ink)}
.pick .yr{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 4px 4px}
.pick .snip{font-size:13px;color:var(--muted);display:block;margin-top:2px}.pick mark,.snip mark{background:var(--warn-soft);color:var(--ink);padding:0 1px;border-radius:2px}
.attgrid{border-collapse:separate;border-spacing:0;font-size:14px;width:auto;min-width:100%}
.attgrid th,.attgrid td{border-bottom:1px solid var(--rule);padding:6px 4px;text-align:center;white-space:nowrap}
.attgrid th:first-child,.attgrid td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding-right:14px;min-width:170px;border-right:1px solid var(--rule)}
.attgrid thead th{font-size:12px;color:var(--muted);font-weight:700;vertical-align:bottom}
.attgrid thead button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;line-height:1.2;padding:2px 4px;border-radius:3px}.attgrid thead button:hover{color:var(--ink);background:var(--ground)}
.attgrid thead b{display:block;color:var(--ink);font-size:13px}
.att-c{width:30px;height:28px;border-radius:3px;border:1px solid var(--rule);background:transparent;font-weight:800;font-size:12px;color:var(--muted);display:inline-grid;place-items:center;padding:0}
button.att-c{cursor:pointer}button.att-c:hover{border-color:var(--ink)}
.att-c.present{background:var(--good);color:var(--surface);border-color:transparent}.att-c.late{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.att-c.na{background:var(--ground);color:var(--muted);border:1px dashed var(--rule);font-size:9.5px;letter-spacing:-.02em}
.attgrid th.future,.attgrid td.future{opacity:.55}.attgrid th.future b::after{content:" ·";}.att-c.absent{background:var(--bad);color:var(--surface);border-color:transparent}
.attgrid .tot{border-left:1px solid var(--rule);padding:6px 10px;font-weight:700}.attgrid .pct{font-weight:800;font-size:15px;padding:6px 12px}.attgrid .pct.low{color:var(--bad)}
.attgrid tfoot td{font-size:12px;color:var(--muted);border-bottom:0;padding-top:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--info);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.att-key{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0;align-items:center}.att-key span{display:inline-flex;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:14px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1.5px solid var(--rule-strong)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:0;border-left:1.5px solid var(--rule);background:transparent;padding:5px 11px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button:first-child{border-left:0}
.seg button:not(:disabled):hover{color:var(--ink)}
.seg button[aria-pressed="true"].present,.seg button[aria-pressed="true"].aye{background:var(--good);color:var(--surface);font-weight:700}
.seg button[aria-pressed="true"].late,.seg button[aria-pressed="true"].abstain{background:var(--warn-soft);color:var(--warn);font-weight:700}
.seg button[aria-pressed="true"].na{background:var(--ground);color:var(--ink);font-weight:700}
.seg button[aria-pressed="true"].absent,.seg button[aria-pressed="true"].nay{background:var(--bad);color:var(--surface);font-weight:700}
.seg button:disabled{cursor:default}
.tally{display:flex;gap:30px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bar{height:10px;border-radius:2px;background:var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* proposal document */
.paperwrap{background:var(--rule);padding:22px;overflow-x:auto;border-radius:4px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f);max-width:720px;margin:0 auto;padding:52px 56px;position:relative;font-size:15.5px;line-height:1.6;min-width:0;border-top:10px solid var(--paper-gold)}
.paper .org{font-size:14px;color:var(--paper-muted);font-weight:500}
.paper .kicker{font-size:15px;font-weight:700;color:var(--paper-ink);margin-top:22px}
.paper .dtitle{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:4px 0 20px;overflow-wrap:anywhere}
.paper .meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 22px;font-size:14px;padding-bottom:18px;border-bottom:3px solid var(--paper-ink)}
.paper .meta dt{color:var(--paper-muted);font-weight:600}
.paper .meta dd{margin:0;overflow-wrap:anywhere}
.paper h4{font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--paper-ink);margin:26px 0 6px}
.paper p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.paper .hint{color:var(--paper-muted);font-style:italic}
.paper table{font-size:14.5px}
.paper td,.paper th{border-bottom:1px solid var(--paper-line);color:var(--paper-ink)}
.paper th{color:var(--paper-muted);border-bottom:1.5px solid var(--paper-ink)}
.paper td.amt,.paper th.amt{text-align:right}
.paper tr.total td{font-weight:800;border-bottom:0}
.paper .res{border-left:5px solid var(--paper-gold);padding-left:16px;font-weight:500}
.paper .res.hint{font-weight:400}
.paper .sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:48px;font-size:13px;color:var(--paper-muted)}
.paper .sigs div{border-top:1.5px solid var(--paper-ink);padding-top:6px}
.paper .wm{position:absolute;top:36%;left:0;right:0;text-align:center;font-size:96px;font-weight:900;color:var(--paper-ink);opacity:.045;transform:rotate(-28deg);pointer-events:none;letter-spacing:.04em}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.edform{display:flex;flex-direction:column;gap:16px}
.edform .hint-text{font-size:14px;color:var(--muted)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 112px 32px;gap:6px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}

/* members */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.person{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.person.me-card{border-top:6px solid var(--rail)}
.person .top{display:flex;gap:14px;align-items:center}
.person p{margin:0;font-size:15px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.stats{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:800}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* who's working on what */
.seg.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:700}
.prow{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:start}
.prow:first-child{border-top:3px solid var(--rule-strong)}
.prow .person-id{display:flex;gap:12px;align-items:center;min-width:0}
.prow .person-id .title{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ptasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ptasks li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding-left:14px;border-left:4px solid var(--rule)}
.ptasks li.doing{border-left-color:var(--rail)}
.ptasks li.done{border-left-color:var(--good);opacity:.7}
.ptasks li .title{font-size:16px}
.ptasks li .sub{grid-column:1/-1}
.state{font-size:14px;font-weight:700;white-space:nowrap}
.state.doing{color:var(--ink)} .state.todo{color:var(--muted)} .state.wait{color:var(--warn)} .state.done{color:var(--good)}

/* suggestions */
.sugs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:3px solid var(--rule-strong)}
.sugs>li{padding:16px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.sugs .sug-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.sugs .sug-head .title{font-size:18px}
.sugs p{margin:0;max-width:70ch;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{border-left:4px solid var(--rail);padding:6px 0 6px 12px;background:var(--surface);max-width:70ch}
.reply-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;max-width:70ch}
.reply-form input,.sugs select{border:1.5px solid var(--rule);background:var(--surface);border-radius:3px;padding:6px 10px;width:100%}
.sugs select{width:auto}
@media (max-width:860px){.prow{grid-template-columns:minmax(0,1fr);gap:10px}}

/* rail: groups and the student/council switch */
.navgroup{font-size:13px;font-weight:600;color:var(--rail-dim);padding:14px 10px 4px}
.navgroup:first-child{padding-top:0}
nav a.navsmall{font-size:14px;font-weight:600;white-space:normal;margin-top:10px;text-decoration:underline;text-underline-offset:3px}
#modeBox .seg{display:flex;width:100%;border-color:var(--rail-ink)}
#modeBox .seg button{flex:1;color:var(--rail-ink);border-color:var(--rail-ink);font-weight:600;padding:6px 8px}
#modeBox .seg button[aria-pressed="true"]{background:var(--rail-ink);color:var(--rail)}
.banner.preview{border-left-color:var(--info);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:none}

/* section tabs */
.subnav{display:flex;gap:4px 24px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:-8px}
.subnav a{padding:4px 0 9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:17px;border-bottom:4px solid transparent;margin-bottom:-1px}
.subnav a:hover{color:var(--ink)}
.subnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--rail)}
a.title{color:var(--ink);text-decoration:none}
a.title:hover{text-decoration:underline;text-underline-offset:3px}
.changes{background:var(--surface);border-left:6px solid var(--bad);padding:14px 18px}
.changes h2{font-size:19px;font-weight:800}
.changes ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.changes li{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.chip.dance{background:var(--rail);color:var(--rail-ink);border-color:transparent}
.chip.trip{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.competition{background:var(--ink);color:var(--ground);border-color:transparent}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--rule);background:transparent;border-radius:99px;padding:4px 13px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.fchip:hover{color:var(--ink);border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn[aria-pressed="true"]{background:var(--rail);border-color:var(--rail);color:var(--rail-ink)}

/* events */
.evlist{display:flex;flex-direction:column;border-top:3px solid var(--rule-strong)}
.event{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid var(--rule)}
.event h3{font-size:23px;font-weight:800;letter-spacing:-.015em}
.event .grow{display:flex;flex-direction:column;gap:8px}
.ev-top{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.changenote{font-weight:700;color:var(--bad)}
.ev-more{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;max-width:880px;padding:6px 0}
.ev-more p{margin:4px 0 0;white-space:pre-wrap}
.going{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px}

/* photo belts, after the Xander Hudson fan wall: two rows drifting opposite ways */
.belts{--h:180px;display:grid;gap:14px;overflow:hidden}
@media (min-width:760px){.belts{--h:230px}}
.belt{overflow:hidden}
.belt__track{display:flex;width:max-content;animation:belt var(--dur,60s) linear infinite}
.belt--back .belt__track{animation-direction:reverse}
.belt__set{display:flex;gap:14px;padding-right:14px}
@keyframes belt{to{transform:translateX(-50%)}}
@media (hover:hover){.belt:hover .belt__track{animation-play-state:paused}}
.shot{flex:none;border:0;padding:0;background:var(--rule);cursor:zoom-in;border-radius:4px;overflow:hidden;height:var(--h)}
.shot img{height:100%;width:auto;max-width:none;display:block}
.shot:hover,.shot:focus-visible{outline:4px solid var(--rail);outline-offset:-4px}
@media (prefers-reduced-motion:reduce){.belt{overflow-x:auto;scroll-snap-type:x proximity}.belt__track{animation:none}.belt__set[aria-hidden]{display:none}.shot{scroll-snap-align:start}}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:12px}
.album-wrap{position:relative;min-width:0}
.album{display:flex;flex-direction:column;gap:3px;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.album-img{aspect-ratio:4/3;background:var(--rule);border-radius:4px;overflow:hidden;display:block;width:100%;margin-bottom:6px}
.album-img img{width:100%;height:100%;object-fit:cover;display:block}
.album:hover .album-img,.album:focus-visible .album-img{outline:4px solid var(--rail);outline-offset:-4px}
.album-wrap .edit{position:absolute;top:8px;right:8px;background:var(--surface)}

/* stories, birthdays, playlists */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:14px}
.story{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.story-img img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.story.meme .story-img img{aspect-ratio:auto;object-fit:contain;max-height:440px;background:var(--stage)}
.story-body{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.story h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.story p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bday{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.bday b{font-size:17px}
.playlist{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}

/* opportunities */
.oppbar{display:flex;flex-direction:column;gap:12px}
.oppbar input{border:2px solid var(--rule-strong);background:var(--surface);border-radius:3px;padding:11px 14px;font-size:18px;width:100%;max-width:640px}
.opps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.opp{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.opp h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.opp p{margin:0;max-width:65ch;overflow-wrap:anywhere}
.opp-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* polls */
.polls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.poll{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.poll h3{font-size:22px;font-weight:800;letter-spacing:-.015em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1.5px solid var(--rule);border-radius:3px;background:transparent;padding:10px 12px;cursor:pointer;text-align:left;overflow:hidden;font-weight:600}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 5px 0 0 var(--rail)}
.opt:disabled{cursor:default;color:var(--ink)}
.optlabel,.optpct{position:relative}
.optpct{font-weight:800}

/* album viewer */
#gallery{position:fixed;inset:0;background:var(--scrim);z-index:55;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gal{background:var(--ground);max-width:1100px;margin:0 auto;border-top:8px solid var(--rail);padding:24px;display:flex;flex-direction:column;gap:16px;border-radius:0 0 6px 6px}
.gal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gal-head h2{font-size:34px;font-weight:800;letter-spacing:-.025em}
.gal-cap{margin:0;max-width:70ch}
.stage{position:relative;background:var(--stage);border-radius:4px;display:grid;place-items:center;min-height:240px;overflow:hidden}
.stage img{max-height:min(68vh,720px);max-width:100%;display:block}
.stage-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:var(--rail);color:var(--rail-ink);font-size:30px;font-weight:800;cursor:pointer;line-height:1;display:grid;place-items:center;padding-bottom:4px}
.stage-nav.prev{left:12px}.stage-nav.next{right:12px}
.stage-count{position:absolute;bottom:10px;right:12px;background:var(--rail);color:var(--rail-ink);font-weight:700;font-size:13px;padding:2px 8px;border-radius:3px}
.thumbs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumbs-grid button{border:0;padding:0;background:var(--rule);aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer}
.thumbs-grid img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs-grid button[aria-current="true"]{outline:4px solid var(--rail);outline-offset:-4px}
.gal-story{border-top:3px solid var(--rule-strong);padding-top:10px}
.gal-story h3,.gal-more{font-size:20px;font-weight:800}
.gal-story p{margin:6px 0 0;max-width:70ch;white-space:pre-wrap}

/* photo upload field */
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumbs:empty{display:none}
.thumb{position:relative}
.thumb-img{border:0;padding:0;width:84px;height:84px;border-radius:3px;overflow:hidden;cursor:pointer;background:var(--rule);display:block;position:relative}
.thumb-img img{width:100%;height:100%;object-fit:cover;display:block}
.cover-tag{position:absolute;left:4px;bottom:4px;background:var(--rail);color:var(--rail-ink);font-size:11px;font-weight:700;padding:0 5px;border-radius:2px}
.thumb-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--ground);cursor:pointer;font-weight:700;line-height:1}
@media (max-width:860px){.opps,.polls{grid-template-columns:minmax(0,1fr)}.event{gap:12px}.gal{padding:14px}.gal-head h2{font-size:25px}.stage-nav{width:40px;height:40px}}

/* pixel UI: buttons, the menu and cards are cut like sprites (notched corners, a hard lip underneath) so the interface belongs to the pixel scene. No blur, no pills, no soft shadows. */
.hbtn,.home-links,.live-card,.post,.opp,.poll,.story,.person,.card{border:0;border-radius:0;background:var(--pb);box-shadow:0 -3px 0 var(--pb),0 3px 0 var(--pb),-3px 0 0 var(--pb),3px 0 0 var(--pb),0 6px 0 var(--pl),-3px 3px 0 var(--pl),3px 3px 0 var(--pl)}
.post,.opp,.poll,.story,.person,.card{--pb:var(--surface);--pl:var(--rule)}
.post.pinned{border:0;border-radius:0;--pl:var(--rail)}
.card.mine{border-left:0;--pl:var(--rail)}
.person.me-card{border-top:0;--pl:var(--rail)}
.opt{border-radius:0}
.fchips{gap:4px 24px}
.fchip{border:0;border-bottom:4px solid transparent;border-radius:0;padding:4px 0;font-size:16px;font-weight:700}
.fchip:hover{border-color:transparent;border-bottom-color:var(--rule)}
.fchip[aria-pressed="true"]{background:none;color:var(--ink);border-color:transparent;border-bottom-color:var(--rail)}
.heart{border:0;background:none;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;padding:2px 4px}

let db=null,U=null,canWrite=true,isEditor=false,taskMode=null,sugFilter="open",dbState="connecting",loaded=new Set();

/* ---------- people & permissions ---------- */
const isApproved=d=>!!(d&&(d.manual||d.sample||CFG.approved[d.id]||d.id===CFG.president));
const full=d=>d&&({...d,role:CFG.roles[d.id]||d.role||"Member"});

let AREA=null;
// shortcut: buttons are gated by the area whose view function is drawing them (see AREAS); a button drawn by an unlisted function only needs council

const clubKey=n=>String(n||"").trim().toLowerCase();
/* why a signed-in person doesn't have council view (website only) */
function accessExplain(){if(!window.__signIn||!me.id||canCouncil())return"";const rc=window.__rosterCheck||{},r=RM(),em=`<b>${esc(me.email||rc.email||"this account")}</b>`;

const allowed=v=>!!ROUTES[v]&&!presOnly(v)&&(council()||STUDENT_ROUTES.includes(v)||(v==="members"&&canJoin()));
const shownView=()=>view&&allowed(view)?view:(council()?"overview":"home");
const safeUrl=u=>/^https:\/\/[^\s"'<>]+$/i.test(u||"")?u:"";
function nameOf(id){if(!id)return"";const m=S.members.find(x=>x.id===id);if(m&&m.name)return m.name;if(PROF[id]&&PROF[id].name)return PROF[id].name;if(id===me.id)return me.name||"You";return"Someone"}
function resolveIds(ids){if(!U)return;const need=[...new Set(ids)].filter(i=>i&&!asked.has(i));if(!need.length)return;need.forEach(i=>asked.add(i));U.profiles(need).then(ps=>{Object.assign(PROF,ps);render()}).catch(()=>{})}

function log(a,k,title){

/* Student Hub */
/* Announcements. Patterns borrowed from big sites: scannable cards with a category, relative date and "New" marker
   (Google Classroom, Linear changelog), short previews with Read more (Slack, LinkedIn), simple formatting (Notion),
   a dismissible banner for important news (GitHub, Stripe), and a one-time pop-up kept for the biggest news (Notion,

let openPosts=new Set(),annQ="",annTag="all",popDone=false;
const postAt=p=>p.at||p.created||(p.date?p.date+"T07:00:00":"");
const isNewPost=p=>!!NEW_SINCE&&postAt(p)>NEW_SINCE;
const daysAgo=d=>d?Math.round((parse(TODAY)-parse(d))/864e5):99;
const isImportant=p=>(p.level==="important"||p.level==="popup")&&!p.removed&&(!p.until||p.until>=TODAY)&&daysAgo(p.date)<=14&&daysAgo(p.date)>=0;
function relDay(d){const n=daysAgo(d);if(!d)return"";if(n===0)return"Today";if(n===1)return"Yesterday";if(n===-1)return"Tomorrow";if(n>1&&n<7)return fmt(d,{weekday:"long"});return longd(d)}

  return String(t||"").trim().split(/\n\s*\n/).map(b=>{const l=b.split("\n").filter(x=>x.trim());return l.length&&l.every(x=>/^\s*[-•*]\s+/.test(x))?`<ul>${l.map(x=>`<li>${inl(x.replace(/^\s*[-•*]\s+/,""))}</li>`).join("")}</ul>`:`<p>${l.map(x=>inl(x.trim())).join("<br>")}</p>`}).join("")}

function makeCloud(w,h,seed,night){

function parseBday(s){if(!s)return null;let m;if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return[+m[2],+m[3]];if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})/)))return[+m[1],+m[2]];const d=new Date(s+" 2000");return isNaN(d)?null:[d.getMonth()+1,d.getDate()]}
function parseRoster(text){
  const rows=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.includes("\t")?l.split("\t"):l.split(","));if(!rows.length)return[];
  let idx={email:0,name:1,grade:2,bday:3,council:4,club:5};const h=rows[0].map(x=>x.trim().toLowerCase());
  if(!h.some(x=>x.includes("@"))){const f=re=>h.findIndex(x=>re.test(x));idx={email:f(/e-?mail/),name:f(/name/),grade:f(/grade|class|year/),bday:f(/birth|bday/),council:f(/stuco|council/),club:f(/club/)};rows.shift()}
  const out=[];
  for(const r of rows){const get=k=>idx[k]>=0?(r[idx[k]]||"").trim():"",email=get("email").toLowerCase();if(!/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(email))continue;
    const b=parseBday(get("bday")),e={name:get("name"),grade:(get("grade").match(/\d+/)||[""])[0],council:!!get("council")&&!/^(n|no|false|0|-)$/i.test(get("council")),clubs:get("club").split(/[;|]/).map(clubKey).filter(Boolean)};
    if(b){e.bm=b[0];e.bd=b[1]}const pos=get("council");if(e.council&&!/^(y|yes|true|x|1|stuco|council|✓)$/i.test(pos))e.role=(ROLES.find(r=>r.toLowerCase()===pos.trim().toLowerCase())||pos).slice(0,60);out.push([email,e])}
  return out}

async function importRoster(){
  const rows=parseRoster($("#rosterPaste").value);if(!rows.length){toast("No rows with an email address found. Check that you copied the Email column.");return}
  const bid=e=>{let h=0;for(const ch of e)h=(h*31+ch.charCodeAt(0))>>>0;return"r"+h.toString(36)},keep=new Set(rows.map(r=>r[0])),bkeep=new Set(),jobs=[],granted=new Set((ADMIN.emails||[]).map(x=>x.toLowerCase()));  // emails the president gave council view stay, even if they are not in the sheet
  for(const[email,e]of rows){const o=S.roster.find(d=>d.id===email);if(granted.has(email))e.council=true;if(o){if(!e.role&&o.role)e.role=o.role;if(o.invitedAt)e.invitedAt=o.invitedAt;if(o.uid)e.uid=o.uid}jobs.push(()=>db.doc("roster/"+email).set(e));if(e.bm&&e.name){bkeep.add(bid(email));jobs.push(()=>db.doc("birthdays/"+bid(email)).set({name:e.name,month:e.bm,day:e.bd,show:true,roster:true}))}}
  for(const d of S.roster)if(!keep.has(d.id)){if(!granted.has(d.id))jobs.push(()=>db.doc("roster/"+d.id).delete());else if(!d.extra||!d.council){const{id,...row}=d;jobs.push(()=>db.doc("roster/"+id).set({...row,council:true,extra:true}))}}
  for(const d of S.birthdays)if(d.roster&&!bkeep.has(d.id))jobs.push(()=>db.doc("birthdays/"+d.id).delete());
  await save(async()=>{for(let i=0;i<jobs.length;i+=20){const st=$("#rosterStatus");if(st)st.textContent=`Importing ${Math.min(i+20,jobs.length)} of ${jobs.length}…`;await Promise.all(jobs.slice(i,i+20).map(j=>j()))}
    await cfgSet(c=>{c.rosterOnly=true})},`Imported ${rows.length} people`,["imported the student list","settings",rows.length+" people"]);
}

/* ---------- daily games ----------
   One game per day, stored at games/<date>. Votes and photo entries are in gamevotes/<uid> (members can read, so anyone's
   browser can work out a result); quiz and Connections progress is private in plays/<uid>. Answers are stored only as
   hashes in the game; the readable copy is in gamekeys/<date>, which only council can read. A council member's browser
   awards the points the next day. */
const GAME_TYPES=[["versus","This or That"],["photo","Photo challenge"],["quiz","Mystery or quiz"],["connections","Connections"]];
const DAY_GAME={1:["versus","This or That"],2:["photo","Photo challenge"],3:["quiz","Mystery"],4:["connections","Avenues Connections"],5:["quiz","Friday mini-game"]};
const gameOn=d=>S.games.find(g=>g.id===d);
const gameName=g=>g.title||({versus:"This or That",photo:"Photo challenge",quiz:"Mystery",connections:"Avenues Connections"})[g.type];
const gnorm=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]/g,"");
async function gh(gid,t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(gid+":"+gnorm(t)));return[...new Uint8Array(b)].slice(0,12).map(x=>x.toString(16).padStart(2,"0")).join("")}
/* practice mode (council): play any game in a sandbox. Nothing is saved or scored. */
let trial=null;
const inTrial=gid=>!!trial&&trial.g.id===gid;
const gameBy=id=>inTrial(id)?trial.g:gameOn(id);
function samplePic(c1,c2){const c=document.createElement("canvas");c.width=c.height=240;const g=c.getContext("2d");g.fillStyle=c1;g.fillRect(0,0,240,240);g.fillStyle=c2;for(let y=0;y<8;y++)for(let x=0;x<8;x++)if((x*3+y*5)%4===0)g.fillRect(x*30,y*30,30,30);return c.toDataURL("image/png")}
async function sampleGame(type){const id="try-"+type;
  if(type==="versus")return{id,type,date:TODAY,q:"Which is better?",a:"Pizza Friday",b:"Taco Tuesday",points:10};
  if(type==="photo")return{id,type,date:TODAY,prompt:"A photo of your desk right now",points:10};
  if(type==="quiz")return{id,type,date:TODAY,title:"Mystery",intro:"Sample rounds. The answers are High Line and yellow, so you can test right and wrong guesses.",points:10,_answers:"1. High Line\n2. Yellow",items:[{q:"The park built on old train tracks next to Avenues",h:[await gh(id,"high line"),await gh(id,"the high line")]},{q:"The color of a New York school bus",h:[await gh(id,"yellow")]}]};
  const raw=[["Boroughs",["Bronx","Queens","Brooklyn","Manhattan"]],["School subjects",["Math","Art","History","Science"]],["In the home page scene",["Bus","Taxi","Biker","Tree"]],["Seasons",["Winter","Spring","Summer","Fall"]]],groups=[],words=[];
  for(const[name,ws]of raw){groups.push({name,h:await gh(id,ws.map(gnorm).sort().join(""))});words.push(...ws)}
  for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]]}
  return{id,type,date:TODAY,title:"Avenues Connections",groups,words,points:10,_answers:raw.map(([n,ws])=>n+": "+ws.join(", ")).join("\n")}}
function startTrial(g){conSel=[];trial={g,v:{},st:{},pics:[samplePic("#F4B400","#14202E"),samplePic("#2446C7","#BFE0F9"),samplePic("#1D7A45","#DFF0E5")]};view="challenges";render();window.scrollTo(0,0)}
function trialHTML(){const g=trial.g;return`<section class="game"><div class="game-head"><span class="av-tag">Practice run</span><h2>${esc(gameName(g))}</h2><span class="sub">Nothing here is saved or scored. Only you can see it.</span></div>${gameHTML(g)}<div class="toolbar"><button class="btn primary" data-act="try-reveal">Preview the reveal</button><button class="btn" data-act="try-reset">Start over</button><button class="btn ghost" data-act="try-exit">Exit practice</button></div></section>`}
const canPlay=()=>!!trial||(canJoin()&&!!myPlay().grade);
const myGV=()=>S.gamevotes.find(d=>d.id===me.id)||{};
const myV=gid=>inTrial(gid)?trial.v:((myGV().v)||{})[gid]||{};

/* Lunch: the dining team's weekly Google Slides deck. The "Lower & Upper Division" slide has a table with a column per
   weekday and rows for entree, vegetarian entree, sides and sandwich. Read from the deck's PowerPoint export. */
const LUNCH_DECK="1L-yszrkXmhuZqqLgmiJdmaejVDgbAJ2PXV9R1ODau8k";
async function unzipEntries(buf,want){const v=new DataView(buf),u=new Uint8Array(buf),out={};let e=buf.byteLength-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)return out;
  let p=v.getUint32(e+16,true);const n=v.getUint16(e+10,true),dec=new TextDecoder();
  for(let k=0;k<n;k++){const meth=v.getUint16(p+10,true),size=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true),name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!want(name))continue;const d=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),raw=u.subarray(d,d+size);
    out[name]=meth===0?dec.decode(raw):await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()}
  return out}
const LUNCH_ROWS=[["veg",/vegetarian|vegan/i],["entree",/entr[eé]e/i],["sides",/side/i],["sandwich",/sandwich/i]];
async function lunchWeek(){if(typeof DecompressionStream!=="function")return null;
  const r=await fetch("https://docs.google.com/presentation/d/"+LUNCH_DECK+"/export/pptx");if(!r.ok)return null;
  const files=await unzipEntries(await r.arrayBuffer(),n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)),A="http://schemas.openxmlformats.org/drawingml/2006/main";
  for(const xml of Object.values(files)){if(!/Upper Division|LD &amp; UD|LD & UD/i.test(xml))continue;
    const doc=new DOMParser().parseFromString(xml,"application/xml"),tbl=doc.getElementsByTagNameNS(A,"tbl")[0];if(!tbl)continue;
    const rows=[...tbl.getElementsByTagNameNS(A,"tr")].map(tr=>[...tr.children].filter(c=>c.localName==="tc").map(tc=>[...tc.getElementsByTagNameNS(A,"p")].map(p=>[...p.getElementsByTagNameNS(A,"t")].map(t=>t.textContent).join("").replace(/\s+/g," ").trim().replace(/,$/,"")).filter(Boolean)));
    const m=lunchFromRows(rows);if(m)return m}
  return null}
function lunchFromRows(rows){const head=rows[0]||[],dates=[],base=parse(TODAY);
  head.forEach((c,i)=>{const t=c.join(" ").match(/(\d{1,2})\/(\d{1,2})/);if(!t)return;let best=null;for(const y of[base.getFullYear()-1,base.getFullYear(),base.getFullYear()+1]){const d=new Date(y,+t[1]-1,+t[2]);if(!best||Math.abs(d-base)<Math.abs(best-base))best=d}dates.push([i,iso(best)])});
  if(!dates.length)return null;const week=weekStart(dates[0][1]),gap=(parse(week)-parse(weekStart(TODAY)))/864e5;if(gap<0||gap>7)return null;
  const days={};for(const[i,d]of dates){const o={};for(const row of rows.slice(1)){const lab=(row[0]||[]).join(" "),k=(LUNCH_ROWS.find(([,re])=>re.test(lab))||[])[0];if(k&&!o[k]&&row[i]&&row[i].length)o[k]=row[i].join(", ")}if(Object.keys(o).length)days[d]=o}
  return Object.keys(days).length?{week,days}:null}
function lunchPost(m){const ds=Object.keys(m.days).sort(),first=parse(ds[0]),last=parse(ds[ds.length-1]),f=d=>GMONTHS[d.getMonth()]+" "+d.getDate();
  return{title:"Lunch this week, "+f(first)+" to "+f(last),body:ds.map(d=>{const o=m.days[d],dd=parse(d);return GDAYS[dd.getDay()]+", "+f(dd)+": "+(o.entree||"See the menu")+(o.veg&&o.veg!==o.entree?"\n  Vegetarian: "+o.veg:"")+(o.sides?"\n  Sides: "+o.sides:"")+(o.sandwich?"\n  Sandwich: "+o.sandwich:"")}).join("\n\n")+"\n\nFrom the dining team's menu. Allergens are listed at each service line."}}
async function settleGames(){
  if(settling||!db||!capOK("games")||!canWrite||!["games","gamevotes","plays","scores","gamekeys"].every(c=>LEAN?fullData(c):loaded.has(c)))return;
  const due=S.games.filter(g=>g.date<TODAY&&!g.awarded);if(!due.length)return;settling=true;
  try{const awards={},done=[];for(const g of due){const pts=Number(g.points)||10,wins={};let result=gameResult(g)||{};
    if(g.type==="versus"){for(const d of S.gamevotes){const p=((d.v||{})[g.id]||{}).pick;if(p&&(result.win==="tie"||p===result.win))wins[d.id]={p:pts,d}}}
    else if(g.type==="photo"){for(const e of photoEntries(g))wins[e.uid]={p:e.uid===result.winner?pts*5:pts,d:e}}
    else{let solved=0,played=0;
      for(const d of S.plays){const st=(d.g||{})[g.id];if(!st)continue;played++;let n=0;
        if(g.type==="quiz"){for(const[i,r]of Object.entries(st.r||{})){const it=(g.items||[])[i];if(it&&r.t&&(it.h||[]).includes(await gh(g.id,r.t)))n++}if(n&&n===(g.items||[]).length)solved++}
        else{for(const x of st.s||[]){const h=await gh(g.id,(x.w||[]).map(gnorm).sort().join(""));if((g.groups||[]).some(q=>q.h===h))n++}if(n>=4)solved++}
        if(n)wins[d.id]={p:n*pts,d}}
      result={solved,played,answers:(S.gamekeys.find(k=>k.id===g.id)||{}).answers||""}}
    for(const[uid,w]of Object.entries(wins)){const a=awards[uid]||(awards[uid]={name:w.d.name||"Student",grade:w.d.grade||"",log:{}});a.log["g"+g.id]={p:w.p,why:gameName(g),d:g.date}}
    /* streak bonus: every 5th game day in a row someone plays earns +5 */
    for(const[uid,d]of gameParticipants(g)){const n=streakAt(uid,g.date);if(n&&n%5===0){const a=awards[uid]||(awards[uid]={name:d.name||"Student",grade:d.grade||"",log:{}});a.log["s"+g.id]={p:STREAK_BONUS,why:n+"-day streak",d:g.date}}}
    done.push([g.id,result])}
    // one write per student, so several days settled together add up instead of overwriting each other
    for(const[uid,a]of Object.entries(awards))await upsert("scores",uid,a);
    for(const[id,result]of done)await db.doc("games/"+id).update({awarded:true,result})}
  catch(e){}finally{settling=false}
}

function loadScript(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement("script");s.src=src;s.onload=()=>test()?res():rej(new Error("load"));s.onerror=rej;document.head.appendChild(s)})}
async function photoData(id){if(!id)return null;if(String(id).startsWith("data:"))return id;
  if(window.__assetData)return await window.__assetData(id);
  const b=await (await fetch(blob(id))).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)})}

async function downloadDeck(){const it=lfItems();if(!it.length){toast("No items to put in the deck yet.");return}
  toast("Building the slides…");
  try{await loadScript("https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js",()=>!!window.PptxGenJS)}catch(e){toast("The slides tool didn't load. Check your connection and try again.");return}
  const p=new PptxGenJS();p.layout="LAYOUT_WIDE";const F="Libre Franklin",NAVY="14202E",GOLD="F4B400",month=lfMonth();
  const s0=p.addSlide();s0.background={color:"FFFFFF"};s0.addShape(p.ShapeType.rect,{x:0,y:0,w:13.33,h:0.35,fill:{color:GOLD},line:{color:GOLD}});
  s0.addText(month+" LOST AND FOUND",{x:0.6,y:2.4,w:12.1,h:1.3,fontFace:F,fontSize:54,bold:true,color:NAVY,align:"center"});
  s0.addText(`${it.length} item${it.length===1?"":"s"}. If something here is yours, tell Student Council.`,{x:0.6,y:3.8,w:12.1,h:0.6,fontFace:F,fontSize:20,color:"56606C",align:"center"});
  for(const x of it){const s=p.addSlide();s.background={color:"FFFFFF"};
    s.addText(month+" LOST AND FOUND",{x:0.5,y:0.3,w:12.3,h:0.8,fontFace:F,fontSize:32,bold:true,color:NAVY,align:"center"});
    const bx=0.6,by=1.35,bw=6.3,bh=5.6,data=await photoData(x.photo).catch(()=>null),dim=data&&await imgSize(data);
    if(data&&dim){const k=Math.min(bw/dim[0],bh/dim[1]),w=dim[0]*k,h=dim[1]*k;s.addImage({data,x:bx+(bw-w)/2,y:by+(bh-h)/2,w,h})}
    else{s.addShape(p.ShapeType.rect,{x:bx,y:by,w:bw,h:bh,fill:{color:"E8ECF1"},line:{color:"E8ECF1"}});s.addText("No photo",{x:bx,y:by+bh/2-0.3,w:bw,h:0.6,fontFace:F,fontSize:18,color:"56606C",align:"center"})}
    const found=x.type==="found",lines=[{text:found?"FOUND":"LOST",options:{fontSize:16,bold:true,color:found?"1D7A45":"B3261E",breakLine:true}},{text:x.what,options:{fontSize:30,bold:true,color:NAVY,breakLine:true}}];
    if(x.where||x.date)lines.push({text:`${found?"Found":"Last seen"}${x.where?": "+x.where:""}${x.date?", "+short(x.date):""}`,options:{fontSize:18,color:"56606C",breakLine:true}});
    if(x.details)lines.push({text:x.details,options:{fontSize:18,color:NAVY,breakLine:true}});
    s.addText(lines,{x:7.4,y:1.6,w:5.4,h:4.4,fontFace:F,valign:"top",paraSpaceAfter:10});
    s.addText(found?"Is this yours? Tell Student Council.":"Seen it? Tell Student Council.",{x:7.4,y:6.2,w:5.4,h:0.5,fontFace:F,fontSize:16,bold:true,color:NAVY});
    s.addShape(p.ShapeType.rect,{x:0,y:7.2,w:13.33,h:0.3,fill:{color:GOLD},line:{color:GOLD}})}
  const data=await p.write({outputType:"blob"});

}

  if(e.time){const t=e.time.replace(":","")+"00",end=new Date(parse(e.date));const[h,m]=e.time.split(":").map(Number);end.setHours(h+1,m);L.push("DTSTART:"+d+"T"+t,"DTEND:"+iso(end).replace(/-/g,"")+"T"+pad(end.getHours())+pad(end.getMinutes())+"00")}
  else{L.push("DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+iso(addDays(parse(e.date),1)).replace(/-/g,""))}
  if(e.location)L.push("LOCATION:"+icsEsc(e.location));const desc=[e.details||e.notes||"",e.change?"Changed: "+e.change:""].filter(Boolean).join("\n");if(desc)L.push("DESCRIPTION:"+icsEsc(desc));L.push("END:VEVENT");return L.join("\r\n")}
const icsWrap=body=>["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Avenues Student Hub//EN","CALSCALE:GREGORIAN",body,"END:VCALENDAR"].join("\r\n")+"\r\n";
function gcalLink(e){const d=(e.date||"").replace(/-/g,"");let dates;if(e.time){const[h,m]=e.time.split(":").map(Number),t=pad(h)+pad(m)+"00",eh=new Date(parse(e.date));eh.setHours(h+1,m);dates=d+"T"+t+"/"+iso(eh).replace(/-/g,"")+"T"+pad(eh.getHours())+pad(eh.getMinutes())+"00"}else dates=d+"/"+iso(addDays(parse(e.date),1)).replace(/-/g,"");
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title||"")+"&dates="+dates+(e.location?"&location="+encodeURIComponent(e.location):"")+((e.details||e.notes)?"&details="+encodeURIComponent(e.details||e.notes):"")}

/* ---------- council votes: everyone adds ideas, then everyone votes ----------
   cvotes/<id>: ideas, votes and notes are maps keyed per idea or per member, so merge-updates from
   different members never overwrite each other. Council only. */
const CV_PHASE=[["ideas","Collecting ideas"],["voting","Voting"],["closed","Results"]];
const cvIdeas=v=>Object.entries(v.ideas||{}).map(([k,x])=>({...x,key:k})).filter(x=>x&&x.text).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
function cvTally(v){const t={};for(const ks of Object.values(v.votes||{}))(ks||[]).forEach(k=>t[k]=(t[k]||0)+1);return t}
const cvKey=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function cvCard(v){
  const ideas=cvIdeas(v),phase=v.phase||"ideas",mine=(v.votes||{})[me.id]||[],k=Number(v.picks)||1,t=cvTally(v),voters=Object.values(v.votes||{}).filter(x=>(x||[]).length).length,owner=v.by===me.id||isPres,can=W()&&council();
  let body="";
  if(phase==="ideas")body=`<ul class="cv-ideas">${ideas.map(x=>`<li><span>${esc(x.text)}</span><span class="sub">${esc(x.name||"")}</span>${can&&(x.by===me.id||owner)?`<button class="ib" data-act="cv-rm" data-id="${v.id}" data-k="${esc(x.key)}" aria-label="Remove ${esc(x.text)}">×</button>`:""}</li>`).join("")||`<li class="sub">No ideas yet. Add the first one.</li>`}</ul>
    ${can?`<div class="reply-form"><input id="cvi-${v.id}" aria-label="Your idea" placeholder="Add an idea" maxlength="120"><button class="btn sm" data-act="cv-add" data-id="${v.id}">Add</button></div>`:""}
    ${can&&owner?`<div class="toolbar"><button class="btn primary" data-act="cv-phase" data-id="${v.id}" data-to="voting" ${ideas.length<2?"disabled":""}>Start voting</button><span class="sub">Each member will pick ${k===1?"one":k}.</span></div>`:""}`;
  else if(phase==="voting")body=`<p class="sub" style="margin:0">Pick ${k===1?"one":"up to "+k}. You've picked ${mine.length}. ${voters} member${voters===1?" has":"s have"} voted.</p>
    <div class="opts">${ideas.map(x=>`<button class="opt" data-act="cv-vote" data-id="${v.id}" data-k="${esc(x.key)}" aria-pressed="${mine.includes(x.key)}" ${can?"":"disabled"}><span class="optlabel">${esc(x.text)}</span>${mine.includes(x.key)?`<span class="optpct">Your pick</span>`:""}</button>`).join("")}</div>
    ${can&&owner?`<div class="toolbar"><button class="btn primary" data-act="cv-phase" data-id="${v.id}" data-to="closed">Close voting and show results</button><button class="btn ghost" data-act="cv-phase" data-id="${v.id}" data-to="ideas">Back to ideas</button></div>`:""}`;
  else{const ranked=ideas.map(x=>({...x,n:t[x.key]||0})).sort((a,b)=>b.n-a.n),cut=(ranked[k-1]||{}).n||0,tie=cut>0&&ranked.length>k&&(ranked[k]||{}).n===cut;
    body=`<ol class="cv-res">${ranked.map((x,i)=>`<li class="${x.n>0&&(i<k||x.n===cut)?"win":""}"><span>${esc(x.text)}</span><b>${x.n}</b></li>`).join("")}</ol>
    <p class="sub" style="margin:0">${voters} voted. The top ${k} ${k===1?"is":"are"} highlighted${tie?". There's a tie at the cutoff, so more than "+k+" are highlighted":""}.</p>
    ${can&&owner?`<div class="toolbar"><button class="btn ghost" data-act="cv-phase" data-id="${v.id}" data-to="voting">Reopen voting</button><button class="btn ghost danger" data-act="cv-del" data-id="${v.id}">Delete</button></div>`:""}`}
  const notes=Object.values(v.notes||{}).filter(n=>n&&n.text).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
  return`<article class="poll cv"><div class="sub parts"><span class="chip ${phase==="voting"?"accent":phase==="closed"?"good":"gold"}">${label(CV_PHASE,phase)}</span><span>Started by ${esc(v.byName||"council")}</span>${can&&owner&&phase!=="closed"?`<button class="btn sm ghost danger" data-act="cv-del" data-id="${v.id}" style="margin-left:auto">Delete</button>`:""}</div><h3>${esc(v.title)}</h3>${v.details?`<p style="margin:0;white-space:pre-wrap">${esc(v.details)}</p>`:""}${body}
  <details class="cv-notes" ${notes.length?"open":""}><summary>Feedback (${notes.length})</summary>${notes.map(n=>`<div class="reply"><b>${esc(n.name||"")}</b> ${esc(n.text)}</div>`).join("")}${can?`<div class="reply-form"><input id="cvn-${v.id}" aria-label="Your feedback" placeholder="Add feedback for the council" maxlength="400"><button class="btn sm" data-act="cv-note" data-id="${v.id}">Send</button></div>`:""}</details></article>`}
function cvotesView(){const vs=[...S.cvotes].sort((a,b)=>(b.created||"").localeCompare(a.created||"")),open=vs.filter(v=>v.phase!=="closed"),done=vs.filter(v=>v.phase==="closed");
  return head("Brainstorm together, then vote. Only Student Council sees this.","Council votes",W()&&council()?`<button class="btn primary" data-act="cv-new">+ New council vote</button>`:"")+
  (open.length?`<div class="polls">${open.map(cvCard).join("")}</div>`:empty("Nothing open right now","Start one: collect Spirit Week day ideas from everyone, then vote on the five you want.","cv-new","Start a council vote",W()&&council()))+
  (done.length?`<section class="panel"><h2>Past votes</h2><div class="polls" style="margin-top:12px">${done.map(cvCard).join("")}</div></section>`:"")}
function cvForm(){openForm({title:"New council vote",submitLabel:"Start collecting ideas",note:"Every council member can add ideas and feedback. When you're ready, start the vote.",
  fields:[{id:"title",label:"What are we deciding?",required:true,full:true,placeholder:"e.g. Spirit Week days"},{id:"picks",label:"How many does each member pick?",type:"number"},{id:"details",label:"Details (optional)",type:"textarea",placeholder:"e.g. We need five days, Monday to Friday."}],values:{picks:5},
  submit:v=>save(()=>col("cvotes").add({title:v.title,details:v.details,picks:Math.max(1,Math.round(Number(v.picks)||1)),phase:"ideas",ideas:{},votes:{},notes:{},by:me.id,byName:myName(),created:new Date().toISOString()}),"Council vote started",["started a council vote:","settings",v.title])})}

/* ---------- proposals ---------- */
function tally(p){const v=p.votes||{},t={aye:0,nay:0,abstain:0};for(const k in v)if(t[v[k]]!=null&&isApproved(S.members.find(m=>m.id===k)))t[v[k]]++;return t}
function nextNumber(){const yy=String(new Date().getFullYear()).slice(2);const n=S.proposals.filter(p=>(p.number||"").startsWith("P-"+yy)).length+1;return`P-${yy}-${pad(n)}`}
function blankProposal(){return{title:"",sponsor:me.id&&amMember()?me.id:"",cosponsors:"",committee:"",date:TODAY,summary:"",background:"",action:"",budget:[{item:"",cost:null}],timeline:"",impact:"",resolution:"",status:"draft"}}
function docModel(p,template=false){
  const B=[],t=tally(p),st=p.status||"draft";
  B.push({k:"org",text:SCHOOL+" Student Council"});
  B.push({k:"kicker",text:"Proposal "+(p.number||(template?"P-YY-NN":"(number assigned on save)"))});
  B.push({k:"title",text:p.title||(template?"Proposal title":"Untitled proposal"),empty:!p.title});
  B.push({k:"meta",rows:[["Sponsor",p.sponsor?nameOf(p.sponsor):template?"Your name":"—"],["Co-sponsors",p.cosponsors||(template?"Members supporting this proposal":"—")],["Committee",p.committee||(template?"Events / Spirit / Fundraising / …":"—")],["Date introduced",p.date?fulld(p.date):template?"Date":"—"],["Status",template?"Draft":label(P_STAGES,st)]]});
  const sec=(key,title)=>{const has=!!(p[key]&&String(p[key]).trim());B.push({k:"h",text:title,empty:!has});B.push({k:"p",text:has?p[key]:HINT[key],empty:!has})};
  sec("summary","Summary");sec("background","Background");sec("action","Proposed action");
  const rows=(p.budget||[]).filter(r=>r&&(r.item||r.cost));
  B.push({k:"h",text:"Budget"});
  if(rows.length)B.push({k:"budget",rows,total:rows.reduce((s,r)=>s+(Number(r.cost)||0),0)});
  else if(template)B.push({k:"budget",rows:[{item:"Item description",cost:0},{item:"Item description",cost:0}],total:0});
  else B.push({k:"p",text:"No funds requested."});
  sec("timeline","Timeline");sec("impact","Expected impact");
  B.push({k:"h",text:"Resolution"});B.push({k:"res",text:p.resolution&&p.resolution.trim()?p.resolution:HINT.resolution,empty:!(p.resolution&&p.resolution.trim())});
  if(!template&&["voting","passed","failed"].includes(st)){B.push({k:"h",text:"Vote record"});B.push({k:"p",text:`Aye ${t.aye}, nay ${t.nay}, abstain ${t.abstain}. ${st==="voting"?"The vote is still open.":st==="passed"?"The motion passed.":"The motion failed."}`})}
  B.push({k:"sig",names:["Student Council President","Secretary","Faculty Advisor"]});
  return{blocks:B,watermark:template?"TEMPLATE":st==="passed"?"":st==="failed"?"NOT ADOPTED":"DRAFT"};
}
function docHTML(p,template=false){
  const{blocks,watermark}=docModel(p,template);
  return(watermark?`<div class="wm" aria-hidden="true">${watermark}</div>`:"")+blocks.map(b=>{
    switch(b.k){
      case"org":return`<div class="org">${esc(b.text)}</div>`;
      case"kicker":return`<div class="kicker">${esc(b.text)}</div>`;
      case"title":return`<div class="dtitle ${b.empty?"hint":""}">${esc(b.text)}</div>`;
      case"meta":return`<dl class="meta">${b.rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
      case"h":return`<h4>${esc(b.text)}</h4>`;
      case"p":return`<p class="${b.empty?"hint":""}">${esc(b.text)}</p>`;
      case"res":return`<p class="res ${b.empty?"hint":""}">${esc(b.text)}</p>`;
      case"budget":return`<table><thead><tr><th>Item</th><th class="amt">Cost</th></tr></thead><tbody>${b.rows.map(r=>`<tr><td>${esc(r.item||"—")}</td><td class="amt">${money(r.cost)}</td></tr>`).join("")}<tr class="total"><td>Total request</td><td class="amt">${money(b.total)}</td></tr></tbody></table>`;
      case"sig":return`<div class="sigs">${b.names.map(n=>`<div>${esc(n)}<br>Signature / Date</div>`).join("")}</div>`;
    }
  }).join("");
}
function exportable(p,template){const m=docModel(p,template);if(!template)m.blocks=m.blocks.filter(b=>!b.empty||b.k==="title"||b.k==="res");return m}

/* PDF via jsPDF */
function buildPDF(p,template=false){
  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter"});
  const PW=612,PH=792,M=64,CW=PW-2*M;let y=M;
  const INK=[20,32,46],MUT=[94,104,115],ACC=[20,32,46],GOLD=[244,180,0],LINE=[213,218,224];
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M}};
  const text=(s,{size=11,style="normal",color=INK,font="helvetica",lh=1.4,after=6,indent=0}={})=>{doc.setFont(font,style);doc.setFontSize(size);doc.setTextColor(...color);
    for(const para of String(s).split("\n")){const lines=doc.splitTextToSize(para||" ",CW-indent);for(const l of lines){ensure(size*lh);doc.text(l,M+indent,y+size);y+=size*lh}}y+=after};
  const{blocks,watermark}=exportable(p,template);
  for(const b of blocks){
    if(b.k==="org")text(b.text,{size:10,color:MUT,after:12});
    else if(b.k==="kicker")text(b.text,{size:11.5,style:"bold",color:INK,after:2});
    else if(b.k==="title")text(b.text,{size:22,font:"helvetica",style:"bold",color:template&&b.empty?MUT:INK,lh:1.2,after:12});
    else if(b.k==="meta"){for(const[k,v]of b.rows){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...MUT);ensure(14);doc.text(k,M,y+9);doc.setFont("helvetica","normal");doc.setTextColor(...INK);const lines=doc.splitTextToSize(String(v),CW-110);lines.forEach((l,i)=>{if(i)ensure(13);doc.text(l,M+110,y+9);y+=13})}y+=6;doc.setDrawColor(...INK);doc.setLineWidth(2.2);doc.line(M,y,PW-M,y);y+=14}
    else if(b.k==="h"){ensure(40);y+=8;text(b.text,{size:13.5,style:"bold",color:INK,after:3})}
    else if(b.k==="p")text(b.text,{size:11.5,style:b.empty?"italic":"normal",color:b.empty?MUT:INK});
    else if(b.k==="res"){const y0=y;text(b.text,{size:11.5,style:"italic",color:b.empty?MUT:INK,indent:14});doc.setDrawColor(...GOLD);doc.setLineWidth(3.5);if(y>y0)doc.line(M+2,y0+2,M+2,y-8)}
    else if(b.k==="budget"){doc.setFontSize(10);const row=(a,c,bold,line=true)=>{ensure(20);doc.setFont("helvetica",bold?"bold":"normal");doc.setTextColor(...INK);const ls=doc.splitTextToSize(String(a),CW-120);ls.forEach((l,i)=>doc.text(l,M,y+12+i*12));doc.text(c,PW-M,y+12,{align:"right"});y+=Math.max(1,ls.length)*12+6;if(line){doc.setDrawColor(...LINE);doc.setLineWidth(.6);doc.line(M,y,PW-M,y)}y+=2};
      doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(...MUT);ensure(16);doc.text("Item",M,y+9);doc.text("Cost",PW-M,y+9,{align:"right"});y+=14;doc.setDrawColor(...LINE);doc.line(M,y,PW-M,y);y+=2;
      b.rows.forEach(r=>row(r.item||"—",money(r.cost),false));row("Total request",money(b.total),true,false);y+=6}
    else if(b.k==="sig"){ensure(80);y+=44;const w=(CW-40)/3;b.names.forEach((n,i)=>{const x=M+i*(w+20);doc.setDrawColor(...INK);doc.setLineWidth(.7);doc.line(x,y,x+w,y);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...MUT);doc.text(n,x,y+12);doc.text("Signature / Date",x,y+23)});y+=30}
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFillColor(...GOLD);doc.rect(0,0,PW,12,"F");
    if(watermark){doc.saveGraphicsState();doc.setGState(new doc.GState({opacity:.07}));doc.setFont("helvetica","bold");doc.setFontSize(96);doc.setTextColor(...INK);doc.text(watermark,PW/2,PH/2+40,{align:"center",angle:30});doc.restoreGraphicsState()}
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...MUT);doc.text(`${p.number||"Proposal template"}${p.title?": "+p.title:""}`.slice(0,90),M,PH-36);doc.text(`Page ${i} of ${n}`,PW-M,PH-36,{align:"right"})}
  return doc.output("blob");
}

/* DOCX via JSZip (opens in Word, and converts to a Google Doc when uploaded to Drive) */

  for(const b of blocks){

    else if(b.k==="kicker")body+=para(run(b.text,{sz:10,b:true,color:"14202E",sp:20}),{after:40});

    else if(b.k==="h")body+=para(run(b.text,{sz:9.5,b:true,color:"14202E",sp:20}),{before:240,after:60,keep:true});
    else if(b.k==="p")body+=lines(b.text,{sz:11.5,i:b.empty,color:b.empty?"6B7285":"1A1F2E"});
    else if(b.k==="res")body+=lines(b.text,{sz:11.5,i:true,color:b.empty?"6B7285":"1A1F2E"},{left:true});

function proposalDetail(p){

    if(["draft","moved","seconded"].includes(st)){const n=P_STAGES[idx+1];next=`<button class="btn primary" data-act="p-stage" data-id="${p.id}" data-to="${n[0]}">Mark as ${n[1].toLowerCase()}</button>`}

      ${cast?`<div class="bar" aria-hidden="true"><i style="width:${t.aye/cast*100}%;background:var(--good)"></i><i style="width:${t.nay/cast*100}%;background:var(--bad)"></i><i style="width:${t.abstain/cast*100}%;background:var(--gold)"></i></div>`:""}
      ${ms.length?`<div class="tablewrap"><table><thead><tr><th>Member</th><th>Role</th><th>Vote</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${who(m.id)}</td><td class="sub">${esc(m.role||"")}</td><td><div class="seg">${VOTES.map(([k,l])=>`<button class="${k}" aria-pressed="${v[m.id]===k}" data-act="vote" data-id="${p.id}" data-m="${m.id}" data-v="${k}" ${canAct()&&st==="voting"?"":"disabled"}>${l}</button>`).join("")}</div></td></tr>`).join("")}</tbody></table></div>`:`<p class="sub">Add members to record votes.</p>`}
    </section>`:`<p class="sub" style="margin:0">Voting opens once the proposal is moved and seconded.</p>`}
  </div>`;
}

function quorum(m){const ms=roster().filter(x=>attV(m,x.id)!=="na"),total=ms.length;let here=0;for(const x of ms){const v=attV(m,x.id);if(v==="present"||v==="late")here++}return{here,total,met:total>0&&here>total/2,need:Math.floor(total/2)+1}}

   "Take roll" is the single-meeting view. Rate = present or late, out of the meetings they were marked at; N/A and unmarked don't count. */
let attView="grid",attFuture=false;
const ATT_NEXT={"":"present",present:"late",late:"absent",absent:"na",na:"present"},ATT_L={present:"P",late:"L",absent:"A",na:"N/A"};

/* Add meetings in bulk: pick a weekday (Thursday by default), how often, and a date range; every matching date is listed
   with a checkbox, so you untick holidays before adding. Dates that already have a meeting are skipped. */

/* The approved email list is what gives council view. Every address on it gets a row on the student list marked

let grantBusy=false,grantFailed=false;
async function syncGrants(){
  if(!isPres||!db||grantBusy||grantFailed||!loaded.has("admin")||!adminExists)return;
  const emails=[...new Set((ADMIN.emails||[]).map(e=>String(e).trim().toLowerCase()).filter(e=>/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(e)))],done=ADMIN.granted;
  if(done&&done.length===emails.length&&emails.every(e=>done.includes(e)))return;
  grantBusy=true;
  try{
    for(const e of emails){const r=await db.doc("roster/"+e).get(),row=r.exists?r.data()||{}:null;
      if(!row)await db.doc("roster/"+e).set({name:"",grade:"",clubs:[],council:true,extra:true});
      else if(!row.council)await db.doc("roster/"+e).set({...row,council:true})}
    for(const e of(done||[]).filter(x=>!emails.includes(x))){const r=await db.doc("roster/"+e).get();if(!r.exists)continue;const row=r.data()||{};
      if(row.extra)await db.doc("roster/"+e).delete();else if(row.council)await db.doc("roster/"+e).set({...row,council:false})}
    await db.doc("admin/access").set({...ADMIN,granted:emails});
  }catch(err){grantFailed=true;toast("Couldn't update council access from your email list. Reload and try again.")}
  finally{grantBusy=false}
}

async function autoApprove(){
  if(!isPres||!U||!db||!loaded.has("admin")||!loaded.has("config")||!loaded.has("members"))return;
  const emails=[...(ADMIN.emails||[]).map(e=>e.toLowerCase()),...S.roster.filter(d=>d.council).map(d=>d.id)];if(!emails.length)return;
  const pend=S.members.filter(d=>!isApproved(d)&&!autoTried.has(d.id));if(!pend.length)return;
  pend.forEach(d=>autoTried.add(d.id));
  const ps=await U.profiles(pend.map(d=>d.id));Object.assign(PROF,ps);

  const roles={};for(const d of ok){const e=(ps[d.id]&&ps[d.id].email||"").toLowerCase();try{const r=await db.doc("roster/"+e).get(),x=r.exists?r.data():null;if(x&&x.role)roles[d.id]=String(x.role).slice(0,60);if(x&&x.invitedAt&&!x.uid)await db.doc("roster/"+e).set({...x,uid:d.id})}catch(err){}}
  const roleOf=d=>roles[d.id]||"";
  if(await save(()=>cfgSet(c=>ok.forEach(d=>{c.approved[d.id]=true;const r=roleOf(d);if(r&&!c.roles[d.id])c.roles[d.id]=r})),`${ok.length} member${ok.length>1?"s":""} approved from your email list`))ok.forEach(d=>log("approved","member",d.name));
